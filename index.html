<style>
:root { --bg:#07070a; --gold:#f3d57a; --muted:rgba(255,255,255,0.66); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: #fff; font-family: 'Outfit', system-ui, -apple-system, sans-serif; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }

header { position: fixed; top: 0; left: 0; right: 0; z-index: 30; display: flex; justify-content: center; align-items: center; padding: calc(12px + env(safe-area-inset-top, 0px)) 18px 12px; }
.brand { font-family: 'Syne', sans-serif; font-weight: 800; letter-spacing: 0.1em; color: var(--gold); font-size: 17px; }
.buy { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); background: #fff; color: #000; padding: 8px 14px; border-radius: 999px; font-size: 12px; font-weight: 700; text-decoration: none; }

/* Carousel stage */
#stage { position: fixed; inset: 0; touch-action: none; overflow: hidden; }
#track { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
.card { position: absolute; left: 0; top: 0; border-radius: 22px; overflow: hidden; background: #111; border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 10px 20px rgba(0,0,0,0.45); will-change: transform, opacity; backface-visibility: hidden; }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }

/* Model name: slides in from bottom or top when centered */
#name { position: fixed; left: 0; right: 0; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); text-align: center; z-index: 15; pointer-events: none; opacity: 0; transform: translateY(42px); }
#name.from-top { transform: translateY(-42px); }
#name.in { opacity: 1; transform: none; transition: transform 0.38s cubic-bezier(0.2, 0.9, 0.2, 1), opacity 0.3s ease; }
.cbtn { margin-top: 10px; pointer-events: auto; background: rgba(255,255,255,0.08); border: 1px solid rgba(243,213,122,0.6); color: #fff; padding: 7px 16px; border-radius: 999px; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.04em; }
#name .nm { font-family: 'Syne', sans-serif; font-weight: 800; font-size: clamp(26px, 7vw, 36px); letter-spacing: 0.02em; }
#name .pr { color: var(--gold); font-size: 14px; font-weight: 600; margin-top: 2px; }
#name .sb { color: var(--muted); font-size: 12px; margin-top: 2px; }

/* Bottom sheet: other colors and photos */
#sheet { position: fixed; left: 0; right: 0; bottom: 0; height: 84vh; height: 84dvh; z-index: 40; background: #0c0c12; border-radius: 26px 26px 0 0; border-top: 1px solid rgba(243,213,122,0.35); transform: translateY(105%); transition: transform 0.45s cubic-bezier(0.2, 0.9, 0.2, 1); display: flex; flex-direction: column; }
#sheet.open { transform: none; }
.sh-grab { height: 30px; display: flex; align-items: center; justify-content: center; touch-action: none; flex-shrink: 0; }
.sh-grab i { width: 44px; height: 5px; border-radius: 9px; background: rgba(255,255,255,0.3); }
.sh-head { display: flex; justify-content: space-between; align-items: center; padding: 2px 20px 12px; touch-action: none; flex-shrink: 0; }
.sh-title { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 24px; }
.sh-price { color: var(--gold); font-size: 13px; margin-top: 2px; }
.sh-close { background: rgba(255,255,255,0.1); border: 0; color: #fff; width: 34px; height: 34px; border-radius: 50%; font-size: 16px; }
.sh-body { flex: 1; overflow-y: auto; padding: 0 16px 16px; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
.sh-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sh-grid figure { position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 3 / 4; background: #111; }
.sh-grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sh-grid figcaption { position: absolute; left: 8px; bottom: 8px; font-size: 11px; background: rgba(0,0,0,0.5); padding: 3px 8px; border-radius: 999px; }
.sh-foot { padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); flex-shrink: 0; }
.sh-cta { display: block; background: #fff; color: #000; text-align: center; padding: 14px; border-radius: 999px; font-weight: 700; text-decoration: none; }
.sh-grid figure { cursor: pointer; }
#viewer { touch-action: none; position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,0.94); display: none; align-items: center; justify-content: center; }
#viewer.open { display: flex; }
#viewer img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 12px; }
#viewer button { position: absolute; background: rgba(255,255,255,0.14); border: 0; color: #fff; width: 44px; height: 44px; border-radius: 50%; font-size: 20px; }
#v-img.anim { transition: transform 0.25s ease; }
#v-x { top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px; }
#v-p { left: 10px; top: 50%; transform: translateY(-50%); }
#v-n { right: 10px; top: 50%; transform: translateY(-50%); }
#v-c { position: absolute; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; text-align: center; color: #fff; font-size: 13px; }
.brand small { display: block; font-size: 9px; font-weight: 600; letter-spacing: 0.24em; color: rgba(255,255,255,0.66); margin-top: 3px; }

.kat-btn { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.1); border: 1px solid rgba(243,213,122,0.6); color: #fff; padding: 8px 14px; border-radius: 999px; font: 600 12px 'Outfit', sans-serif; }
#catalog { position: fixed; inset: 0; z-index: 55; background: var(--bg); display: none; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: calc(78px + env(safe-area-inset-top, 0px)) 18px calc(30px + env(safe-area-inset-bottom, 0px)); }
#catalog.open { display: block; }
#catalog .cat-top { position: fixed; top: 0; left: 0; right: 0; height: calc(60px + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) 14px 0; display: flex; align-items: center; justify-content: space-between; background: var(--bg); border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 2; }
#catalog .cat-back { background: none; border: 0; color: #fff; font: 600 14px 'Outfit', sans-serif; padding: 8px; }
#catalog .cat-title { font-family: 'Syne', sans-serif; font-weight: 800; color: var(--gold); letter-spacing: 0.08em; }
#catalog .cat-sp { width: 60px; }
#catalog .cat-type { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 18px; margin: 22px 0 10px; }
#catalog .cat-type small { color: var(--muted); font-family: 'Outfit', sans-serif; font-weight: 500; font-size: 12px; margin-left: 6px; }
#catalog .chips { display: flex; flex-wrap: wrap; gap: 8px; }
#catalog .chip { padding: 7px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.18); color: rgba(255,255,255,0.7); font: 600 12px 'Outfit', sans-serif; background: none; }
#catalog .chip.has { border-color: rgba(243,213,122,0.7); color: #fff; }

#catalog .cat-search { width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.06); color: #fff; font: 500 15px 'Outfit', sans-serif; outline: none; margin-bottom: 6px; }
#catalog .cat-sec { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 0.14em; color: var(--gold); margin: 22px 0 8px; }
#catalog .promo-card { padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(243,213,122,0.25); margin-bottom: 10px; }
#catalog .pc-t { font-weight: 700; font-size: 15px; }
#catalog .pc-x { color: var(--muted); font-size: 13px; margin: 4px 0 8px; line-height: 1.4; }

header { flex-direction: column; gap: 8px; }
.kat-btn, .buy { top: 48px; }
.promo-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.promo-btn { background: rgba(7,7,10,0.7); border: 1px solid rgba(243,213,122,0.6); color: #fff; padding: 6px 10px; border-radius: 999px; font: 600 11px 'Outfit', sans-serif; }
#promo { position: fixed; inset: 0; z-index: 56; background: var(--bg); display: none; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: calc(78px + env(safe-area-inset-top, 0px)) 18px calc(30px + env(safe-area-inset-bottom, 0px)); }
#promo.open { display: block; }
#promo .cat-top { position: fixed; top: 0; left: 0; right: 0; height: calc(60px + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) 14px 0; display: flex; align-items: center; justify-content: space-between; background: var(--bg); border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 2; }
#promo .cat-back { background: none; border: 0; color: #fff; font: 600 14px 'Outfit', sans-serif; padding: 8px; }
#promo .cat-title { font-family: 'Syne', sans-serif; font-weight: 800; color: var(--gold); letter-spacing: 0.08em; }
#promo .cat-sp { width: 60px; }
#promo .promo-card { padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(243,213,122,0.25); margin-bottom: 10px; }
#promo .pc-t { font-weight: 700; font-size: 15px; }
#promo .pc-x { color: var(--muted); font-size: 13px; margin: 4px 0 8px; line-height: 1.4; }
#promo .chips { display: flex; flex-wrap: wrap; gap: 8px; }
#promo .chip { padding: 7px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.18); color: rgba(255,255,255,0.7); font: 600 12px 'Outfit', sans-serif; background: none; }
#promo .chip.has { border-color: rgba(243,213,122,0.7); color: #fff; }

.logo-wrap { position: relative; height: var(--lh); aspect-ratio: 520 / 158; flex-shrink: 0; animation: logoGlow 3.6s ease-in-out infinite; }
.logo, .logo-shine { position: absolute; inset: 0; }
.logo { background: var(--logo) center / 100% 100% no-repeat; }
.logo-shine {
  -webkit-mask: var(--logo) center / 100% 100% no-repeat; mask: var(--logo) center / 100% 100% no-repeat;
  background: linear-gradient(105deg, rgba(255,255,255,0) 38%, rgba(255,250,225,0.95) 50%, rgba(255,255,255,0) 62%);
  background-size: 260% 100%; background-repeat: no-repeat; background-position: 130% 0;
  animation: logoShine 3.8s cubic-bezier(.45,.05,.35,1) infinite;
}
@keyframes logoShine { 0% { background-position: 130% 0; } 60%, 100% { background-position: -30% 0; } }
@keyframes logoGlow { 0%, 100% { filter: drop-shadow(0 0 2px rgba(243,200,90,0.20)); } 50% { filter: drop-shadow(0 0 9px rgba(243,200,90,0.55)); } }

/* ===== Chegirma / Yangilik / Aksiya: tilla chiziq bo'ylab aylanma harakat (har biri har xil) ===== */
header { gap: 6px; }

.promo-btn { position: relative; z-index: 0; overflow: hidden; isolation: isolate; border: 0; background: transparent; color: #fff; padding: 7px 12px; border-radius: 999px; transform: translateZ(0); -webkit-mask-image: -webkit-radial-gradient(white, black); }
.promo-btn::before { content: ''; position: absolute; left: 50%; top: 50%; width: 320%; aspect-ratio: 1; z-index: -2; transform: translate(-50%, -50%) rotate(0deg); }
.promo-btn::after { content: ''; position: absolute; inset: 1.5px; border-radius: inherit; background: #0b0b10; z-index: -1; }
/* 1: bitta yorqin nuqta, soat mili bo'yicha, bir tekis */
.promo-btn[data-k="chegirma"]::before { background: conic-gradient(from 0deg, rgba(243,213,122,0.28) 0deg, rgba(243,213,122,0.28) 250deg, #f3d57a 310deg, #fff6c8 350deg, rgba(243,213,122,0.28) 360deg); animation: spinCW 2.8s linear infinite; }
/* 2: ikkita qarama-qarshi nuqta, soat miliga teskari, sekinroq */
.promo-btn[data-k="yangilik"]::before { background: conic-gradient(from 0deg, rgba(243,213,122,0.28) 0deg, #f3d57a 25deg, #fff6c8 40deg, rgba(243,213,122,0.28) 75deg, rgba(243,213,122,0.28) 180deg, #e9b94a 205deg, #ffe9a0 220deg, rgba(243,213,122,0.28) 255deg, rgba(243,213,122,0.28) 360deg); animation: spinCCW 4.4s linear infinite; animation-delay: -1.3s; }
/* 3: keng yoy, oldinga-orqaga tebranadi (ping-pong), nafas oladi */
.promo-btn[data-k="aksiya"]::before { background: conic-gradient(from 0deg, rgba(243,213,122,0.28) 0deg, rgba(243,213,122,0.28) 200deg, #d9a23a 250deg, #f3d57a 290deg, #fff6c8 320deg, #f3d57a 340deg, rgba(243,213,122,0.28) 360deg); animation: swing 3.2s ease-in-out infinite alternate; animation-delay: -0.7s; }
.promo-btn[data-k="aksiya"] { animation: btnBreath 2.4s ease-in-out infinite; }
@keyframes spinCW { to { transform: translate(-50%, -50%) rotate(360deg); } }
@keyframes spinCCW { to { transform: translate(-50%, -50%) rotate(-360deg); } }
@keyframes swing { from { transform: translate(-50%, -50%) rotate(-150deg); } to { transform: translate(-50%, -50%) rotate(210deg); } }
@keyframes btnBreath { 0%, 100% { filter: drop-shadow(0 0 0 rgba(243,213,122,0)); } 50% { filter: drop-shadow(0 0 6px rgba(243,213,122,0.55)); } }
@media (prefers-reduced-motion: reduce) { .logo-wrap, .logo-shine, .promo-btn, .promo-btn::before { animation: none !important; } }

/* Toast */
#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); z-index: 90; background: rgba(20,20,26,0.96); border: 1px solid rgba(243,213,122,0.6); color: #fff; padding: 10px 16px; border-radius: 999px; font: 600 13px 'Outfit', sans-serif; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; max-width: 90vw; text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ===== Logo osti yozuvi ===== */
.tagline { display: flex; flex-direction: column; align-items: center; gap: 1px; margin-top: -4px; text-align: center; pointer-events: none; }
.tagline .tg1 { font: 600 11px 'Outfit', sans-serif; letter-spacing: 0.08em; }
.tagline .tg2 { font: 500 10px 'Outfit', sans-serif; letter-spacing: 0.03em; opacity: 0.9; }
.shimmer { color: transparent; background: linear-gradient(105deg, rgba(255,255,255,0) 40%, rgba(255,251,230,0.95) 50%, rgba(255,255,255,0) 60%) no-repeat 140% 0 / 250% 100%, linear-gradient(#e9c866, #f3d57a); -webkit-background-clip: text; background-clip: text; animation: tgShine 4.2s ease-in-out infinite; }
.tagline .tg2 { animation-delay: 0.5s; }
@keyframes tgShine { 0% { background-position: 140% 0, 0 0; } 55%, 100% { background-position: -40% 0, 0 0; } }
@media (prefers-reduced-motion: reduce) { .shimmer { animation: none; } }

/* ===== Kattalashtirilgan logo va yozuvlar ===== */
:root { --lh: clamp(46px, 15.5vw, 64px); --gold-grad: linear-gradient(180deg, #fbe492 0%, #e2a844 55%, #b9781f 100%); }
.kat-btn, .buy { top: calc(env(safe-area-inset-top, 0px) + 8px); transform: none; padding: 7px 11px; font-size: 11px; }
.kat-btn { left: 12px; } .buy { right: 12px; }
.tagline { gap: 4px; margin-top: -2px; }
.tagline .tg1 { font: 700 clamp(13px, 4.2vw, 17px) 'Outfit', sans-serif; letter-spacing: 0.06em; color: transparent;
  background: linear-gradient(105deg, rgba(255,255,255,0) 40%, rgba(255,251,230,0.95) 50%, rgba(255,255,255,0) 60%) no-repeat 140% 0 / 250% 100%, var(--gold-grad);
  -webkit-background-clip: text; background-clip: text; animation: tgShine 4.2s ease-in-out infinite; }
.tagline .tg2 { font: 800 clamp(14px, 4.5vw, 19px)/1.15 'Syne', sans-serif; letter-spacing: 0.05em; opacity: 1; text-transform: uppercase; animation: none; }
.tg2 .ln { display: block; white-space: nowrap; }
.tg2 .wd { display: inline-block; white-space: nowrap; }

    cur = i;
    var u = window.orderUrl(i);
    document.getElementById('cbuy').href = u;
    document.getElementById('hbuy').href = u;
    render();
  };
  document.getElementById('cfav').addEventListener('click', function () {
    var fn = FABRICS[cur].n, k = FAV.indexOf(fn);
    if (k >= 0) FAV.splice(k, 1); else FAV.push(fn);
    try { localStorage.setItem('lh_fav', JSON.stringify(FAV)); } catch (e) {}
    render();
  });
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href^="https://t.me/"]');
    var w = window.Telegram && Telegram.WebApp;
    if (a && w && w.openTelegramLink) {
      e.preventDefault();
      try { w.openTelegramLink(a.href); } catch (x) { window.open(a.href, '_blank'); }
    }
  });
  window.onShown(0);
})();
</script>
</body>
</html>
